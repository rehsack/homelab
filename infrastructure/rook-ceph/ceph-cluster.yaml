# ceph-cluster.yaml
apiVersion: ceph.rook.io/v1
kind: CephCluster
metadata:
  name: rook-ceph
  namespace: rook-ceph
spec:
  cephVersion:
    image: quay.io/ceph/ceph:v19
    allowUnsupported: false
  dataDirHostPath: /var/lib/rook
  mon:
    count: 1
    allowMultiplePerNode: true
  mgr:
    count: 1
  dashboard:
    enabled: true
  storage:
    useAllNodes: false
    useAllDevices: false
    nodes:
      - name: f5a-01
        devices:
          - name: nvme0n1
          - name: nvme1n1
      - name: ms-a2-01
        devices:
          # Explicit per-disk list — do NOT switch to deviceFilter "^nvme",
          # that would also catch /dev/nvme2n1 (the 970 EVO Plus, reserved
          # as Yocto-scratch via UserVolumeConfig — see CLAUDE.md storage
          # tiering).
          - name: nvme0n1   # Samsung SSD 990 PRO 4TB (S7DPNU0Y715145B)
          - name: nvme1n1   # Samsung SSD 990 PRO 4TB (S7DPNU0Y738012X)
  network:
    provider: host
  placement:
    all:
      tolerations:
        - operator: Exists
