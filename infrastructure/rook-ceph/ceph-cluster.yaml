# ceph-cluster.yaml
apiVersion: ceph.rook.io/v1
kind: CephCluster
metadata:
  name: rook-ceph
  namespace: rook-ceph
spec:
  cephVersion:
    image: quay.io/ceph/ceph:v19.2.4   # pin exact patch — never a floating tag
    allowUnsupported: false
  dataDirHostPath: /var/lib/rook
  mon:
    count: 1
    allowMultiplePerNode: true
  mgr:
    count: 1
  dashboard:
    enabled: true
  storage:
    useAllNodes: false
    useAllDevices: false
    # OSD disks are selected by their STABLE /dev/disk/by-id MODEL path, never the
    # kernel enumeration name (nvme0n1) — those can reorder across a cold boot (they
    # held over two cold boots in practice, but the name is incidental, not
    # guaranteed). Matching by-id makes OSD selection reproducible, which is what
    # matters for disaster recovery. The model string uniquely selects the two
    # Samsung 990 PRO 4TB on each node and EXCLUDES the ms-a2-01 Yocto-scratch NVMe
    # (Samsung 970 EVO Plus 2TB) and the USB-C boot SSD (a different model / usb).
    # OSD disk serials (for reference):
    #   f5a-01   : S7DPNJ0Y104547J, S7DPNJ0Y104559F
    #   ms-a2-01 : S7DPNU0Y738012X, S7DPNU0Y715145B  (scratch 970 EVO = S4J4NG0M708735T, excluded)
    devicePathFilter: "Samsung_SSD_990_PRO_4TB"
    nodes:
      - name: f5a-01
      - name: ms-a2-01
  network:
    provider: host
  placement:
    all:
      tolerations:
        - operator: Exists
