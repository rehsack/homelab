# Ceph RBD block pool for databases (first consumer: cubeSQL).
#
# A database wants a block device with proper locking/fsync semantics — NOT the
# shared CephFS network filesystem. This pool is purely ADDITIVE: it shares the
# existing 4x Samsung 990 PRO OSD set (like the .mgr and cephfs-* pools already
# do) and does not touch CephFS or its data. size:2 / failureDomain host to match
# the rest of the cluster.
apiVersion: ceph.rook.io/v1
kind: CephBlockPool
metadata:
  name: replicapool
  namespace: rook-ceph
spec:
  failureDomain: host
  replicated:
    size: 2
---
# Block StorageClass. Deliberately NOT the default "always rook-cephfs" convention
# (LLM.md) — databases are the documented exception that wants block/RWO.
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: rook-ceph-block
provisioner: rook-ceph.rbd.csi.ceph.com
parameters:
  clusterID: rook-ceph
  pool: replicapool
  imageFormat: "2"
  imageFeatures: layering
  csi.storage.k8s.io/provisioner-secret-name: rook-csi-rbd-provisioner
  csi.storage.k8s.io/provisioner-secret-namespace: rook-ceph
  csi.storage.k8s.io/controller-expand-secret-name: rook-csi-rbd-provisioner
  csi.storage.k8s.io/controller-expand-secret-namespace: rook-ceph
  csi.storage.k8s.io/node-stage-secret-name: rook-csi-rbd-node
  csi.storage.k8s.io/node-stage-secret-namespace: rook-ceph
  csi.storage.k8s.io/fstype: ext4
reclaimPolicy: Delete
allowVolumeExpansion: true
