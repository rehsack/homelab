# Cilium Helm values — SSOT for the `cilium` release (namespace kube-system).
#
# Matches the live release (`helm get values cilium`); deployed version and the
# upgrade command live in README.md.
#
# Contains NO secrets — WireGuard keys are generated by Cilium at runtime, not
# stored here → committed in clear. Should future values carry secrets, encrypt
# via SOPS per .sops.yaml.
#
# NOTE on k8sServiceHost: with kube-proxy replacement Cilium talks directly to
# the API server at this address — f5a-01's node IP .40, the canonical endpoint
# (talos/homelab-endpoint.yaml). It moves to the VIP .240 together with the
# endpoint in Phase 3 (req42 roadmap).

cgroup:
  autoMount:
    enabled: false
  hostRoot: /sys/fs/cgroup
encryption:
  enabled: true
  type: wireguard
externalIPs:
  enabled: true
hubble:
  relay:
    enabled: true
  ui:
    enabled: true
ipam:
  mode: kubernetes
k8sServiceHost: 192.168.47.40
k8sServicePort: 6443
kubeProxyReplacement: true
l2announcements:
  enabled: true
securityContext:
  capabilities:
    ciliumAgent:
      - CHOWN
      - KILL
      - NET_ADMIN
      - NET_RAW
      - IPC_LOCK
      - SYS_ADMIN
      - SYS_RESOURCE
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
    cleanCiliumState:
      - NET_ADMIN
      - SYS_ADMIN
      - SYS_RESOURCE
# One node at a time: the chart default (2) replaces every agent at once on a
# two-node cluster, leaving no node able to start pods mid-rollout.
updateStrategy:
  rollingUpdate:
    maxUnavailable: 1
