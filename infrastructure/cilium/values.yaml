# Cilium Helm values — SSOT for the `cilium` release (namespace kube-system).
#
# Captured verbatim from the live cluster (`helm get values cilium`) on
# 2026-07-03. Chart cilium-1.19.1 / app v1.19.1 (release revision 2).
#
# Contains NO secrets — WireGuard keys are generated by Cilium at runtime, not
# stored here → committed in clear. Should future values carry secrets, encrypt
# via SOPS per .sops.yaml.
#
# NOTE on k8sServiceHost: with kube-proxy replacement Cilium talks directly to
# the API server at this address. It is f5a-01's node IP .40, matching the
# deployed release. The cluster API endpoint has since moved to the VIP
# 192.168.47.240 — revisit this value on the next Cilium upgrade / when a 2nd CP
# lands. Left as-is here to keep this file a faithful capture of running state.

cgroup:
  autoMount:
    enabled: false
  hostRoot: /sys/fs/cgroup
encryption:
  enabled: true
  type: wireguard
externalIPs:
  enabled: true
hubble:
  relay:
    enabled: true
  ui:
    enabled: true
ipam:
  mode: kubernetes
k8sServiceHost: 192.168.47.40
k8sServicePort: 6443
kubeProxyReplacement: true
l2announcements:
  enabled: true
securityContext:
  capabilities:
    ciliumAgent:
      - CHOWN
      - KILL
      - NET_ADMIN
      - NET_RAW
      - IPC_LOCK
      - SYS_ADMIN
      - SYS_RESOURCE
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
    cleanCiliumState:
      - NET_ADMIN
      - SYS_ADMIN
      - SYS_RESOURCE
