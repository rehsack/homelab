apiVersion: apps/v1
kind: Deployment
metadata:
  name: cubesql
  namespace: soho
  labels:
    app.kubernetes.io/name: cubesql
    app.kubernetes.io/component: database
    app.kubernetes.io/part-of: fibu
spec:
  replicas: 1
  strategy:
    type: Recreate          # single RWO volume — never two pods mounting it at once
  selector:
    matchLabels:
      app.kubernetes.io/name: cubesql
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cubesql
        app.kubernetes.io/component: database
        app.kubernetes.io/part-of: fibu
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000          # makes the RBD /data volume writable for uid 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: cubesql
          # Community image, digest-pinned for reproducibility (upstream CI only
          # publishes :latest). This digest carries cubeSQL 5.9.0 — older than the
          # project's git tags (5.9.6) but within MonKey Office's supported 5.7-5.9
          # range. Pinning the exact version is the reason to build an own image
          # later (see README). Binary is baked in → plain pull-and-run.
          image: docker.io/joseluisq/cubesql@sha256:10f5060d90b931d041963924f5fb0de98dc38e93e9429a870f949cac2b634485
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            # non-root (uid 1000, see pod securityContext) → restricted-PSA clean.
            # If cubeSQL cannot write /data on first run, the fsGroup mount is the
            # thing to check.
          env:
            - name: CUBESQL_PORT
              value: "4430"
            # Bring the server up PLAIN first to register the free license via
            # cubeSQL Admin, THEN enable SSL-only and redeploy:
            # - name: CUBESQL_SSL_ONLY
            #   value: "true"
          ports:
            - name: cubesql
              containerPort: 4430
          volumeMounts:
            - name: data
              mountPath: /data
          readinessProbe:
            tcpSocket:
              port: 4430
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 4430
            initialDelaySeconds: 20
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 1Gi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: cubesql-data
