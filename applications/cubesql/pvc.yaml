apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: cubesql-data
  namespace: soho
  labels:
    app.kubernetes.io/name: cubesql
    app.kubernetes.io/component: database
    app.kubernetes.io/part-of: fibu
spec:
  # Block/RWO on the RBD pool — a database wants block, not CephFS (see
  # infrastructure/rook-ceph/ceph-blockpool.yaml). Holds /data: the cubeSQL
  # settings, the SQLite databases, the free-license registration.
  accessModes:
    - ReadWriteOnce
  storageClassName: rook-ceph-block
  resources:
    requests:
      storage: 10Gi
