apiVersion: v1
kind: Service
metadata:
  name: cubesql
  namespace: soho
  labels:
    app.kubernetes.io/name: cubesql
    app.kubernetes.io/component: database
    app.kubernetes.io/part-of: fibu
spec:
  # LoadBalancer so the two MonKey Office desktop clients (Kerstin & Jens) reach
  # cubeSQL directly. Cilium LB-IPAM assigns an IP from 192.168.47.200-209
  # (Forgejo already holds .200). Check the assigned IP with:
  #   kubectl -n soho get svc cubesql
  type: LoadBalancer
  selector:
    app.kubernetes.io/name: cubesql
  ports:
    - name: cubesql
      port: 4430
      targetPort: 4430
      protocol: TCP
