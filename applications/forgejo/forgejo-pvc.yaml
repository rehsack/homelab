apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: forgejo-data
  namespace: soho
  labels:
    app.kubernetes.io/name: forgejo
    app.kubernetes.io/component: git-forge
    app.kubernetes.io/part-of: forgejo
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: rook-ceph-block
  resources:
    requests:
      storage: 50Gi
