apiVersion: v1
kind: Service
metadata:
  name: forgejo
  namespace: soho
  labels:
    app.kubernetes.io/name: forgejo
    app.kubernetes.io/component: git-forge
    app.kubernetes.io/part-of: forgejo
spec:
  type: LoadBalancer
  selector:
    app.kubernetes.io/name: forgejo
  ports:
    - name: http
      port: 3000
      targetPort: 3000
      protocol: TCP
    - name: ssh
      port: 22
      targetPort: 2222
      protocol: TCP
