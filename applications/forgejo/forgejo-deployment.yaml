apiVersion: apps/v1
kind: Deployment
metadata:
  name: forgejo
  namespace: soho
  labels:
    app.kubernetes.io/name: forgejo
    app.kubernetes.io/component: git-forge
    app.kubernetes.io/part-of: forgejo
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: forgejo
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app.kubernetes.io/name: forgejo
        app.kubernetes.io/component: git-forge
        app.kubernetes.io/part-of: forgejo
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: init-config
          image: busybox:1.37
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          command:
            - sh
            - -c
            - |
              mkdir -p /data/custom/conf
              if [ ! -f /data/custom/conf/app.ini ]; then
                cp /etc/forgejo/app.ini /data/custom/conf/app.ini
                echo "app.ini copied from ConfigMap"
              else
                echo "app.ini already exists, skipping"
              fi
          volumeMounts:
            - name: data
              mountPath: /data
            - name: config
              mountPath: /etc/forgejo
      containers:
        - name: forgejo
          image: codeberg.org/forgejo/forgejo:15.0.10-rootless   # pin exact patch — never a floating tag
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          ports:
            - name: http
              containerPort: 3000
            - name: ssh
              containerPort: 2222
          volumeMounts:
            - name: data
              mountPath: /var/lib/gitea
          livenessProbe:
            httpGet:
              path: /api/healthz
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /api/healthz
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 5
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: forgejo-data
        - name: config
          configMap:
            name: forgejo-config
      # Admin user creation: README.adoc, "Admin-User erstellen".
