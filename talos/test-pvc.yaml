apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: cephfs-test
spec:
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 1Gi
  storageClassName: rook-cephfs
---
apiVersion: v1
kind: Pod
metadata:
  name: cephfs-test-pod
spec:
  containers:
    - name: test
      image: busybox
      command: ["sh", "-c", "echo 'CephFS works on Talos!' > /mnt/test.txt && cat /mnt/test.txt && sleep 3600"]
      volumeMounts:
        - mountPath: /mnt
          name: cephfs-vol
  volumes:
    - name: cephfs-vol
      persistentVolumeClaim:
        claimName: cephfs-test
