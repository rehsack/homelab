# ============================================================
# Talos Machine Config Patches - Acemagic F5A (f5a)
# Boot: USB-C SSD (Pyrite 2400, 512GB)
# Storage: 2x 4TB Samsung 990 PRO NVMe → Rook-Ceph
# Rolle: Control Plane + Workloads (Single-Node-Start)
# ============================================================
#
# Verwendung:
#   1. talosctl gen secrets -o secrets.yaml
#   2. talosctl gen config homelab https://<F5A-IP>:6443 \
#        --with-secrets secrets.yaml \
#        --config-patch @patches/f5a.yaml
#   3. talosctl apply-config --insecure \
#        --nodes <F5A-IP> \
#        --file controlplane.yaml
#   4. talosctl bootstrap --nodes <F5A-IP>
#   5. talosctl kubeconfig --nodes <F5A-IP>
#   6. Rook-Ceph deployen (siehe rook-ceph/ Verzeichnis)
#
# ============================================================

machine:
  install:
    image: factory.talos.dev/metal-installer/fa12d1c653f6b32d040a132c841e00a99aeb5a54f8c2a9880f3e3081a5e89588:v1.13.0
    diskSelector:
      # USB-SSD als Boot-Disk: matcht auf nicht-NVMe
      match: disk.transport != 'nvme'
    wipe: true

  network:
    hostname: f5a-01
    interfaces:
      - interface: enp197s0
        dhcp: true
        vip:
          ip: 192.168.47.240

  nodeLabels:
    node.kubernetes.io/role: controlplane-worker

  # Rook-Ceph braucht diese Kernel-Module
  # (iscsi-tools Extension liefert die iSCSI-Module,
  #  rbd ist im Talos-Kernel enthalten)
  sysctls:
    vm.dirty_ratio: "10"
    vm.dirty_background_ratio: "5"

cluster:
  controlPlane:
    endpoint: https://192.168.47.40:6443
  allowSchedulingOnControlPlane: true

---
# --- EPHEMERAL begrenzen (100GB auf USB-SSD) ---
apiVersion: v1alpha1
kind: VolumeConfig
name: EPHEMERAL
provisioning:
  maxSize: 100GiB
  grow: false

# ============================================================
# NVMe-Disks: KEINE UserVolumeConfig!
# Beide Samsung 990 PRO 4TB bleiben als Raw-Disks erhalten.
# Rook-Ceph erkennt sie automatisch als verfügbare OSDs.
#
# Nach dem Bootstrap:
#   kubectl apply -f rook-ceph/operator.yaml
#   kubectl apply -f rook-ceph/cluster.yaml
#   kubectl apply -f rook-ceph/storageclass.yaml
#
# Ceph-Cluster Config (cluster.yaml) sollte enthalten:
#   storage:
#     useAllNodes: true
#     useAllDevices: false
#     deviceFilter: "^nvme"       # Nur NVMe-Disks
#     config:
#       osdsPerDevice: "1"
#
# Single-Node: Replikation auf size: 1 setzen bis
# weitere Nodes dem Cluster beigetreten sind.
# ============================================================
