# K8s component image pins — SSOT for the cluster's Kubernetes version.
#
# Weg B (GitOps): the Kubernetes control-plane component versions live HERE in
# git, not implicitly in whatever Talos release happens to be installed and not
# in procedural `talosctl upgrade-k8s` state. Apply this patch ONLY on control-
# plane nodes at gen-config time — apiServer/controllerManager/scheduler/etcd
# config is rejected on workers ("etcd config is only allowed on control plane
# machines"). Workers pin only kubelet (in their machine patch). With a single
# CP today this is one node; revisit when CP count grows in Phase 3.
#
# Versions match the Talos v1.13.6 defaults (verified via
#   talosctl image k8s-bundle --k8s-version v1.36.2 --etcd-version v3.6.12).
# coreDNS/etcd are unchanged from 1.13.4; only the k8s components move to 1.36.2.
# To bump Kubernetes: change the tags here, commit, re-apply — the diff is the
# upgrade record. No node reboot needed for a pure k8s-component bump (static
# pods + kubelet restart in place); the OS/extension version is bumped
# separately via the node's talos/<node>-schematics.yaml + `talosctl upgrade`.
#
# kube-proxy is intentionally absent: Cilium runs kube-proxy replacement
# (cluster.proxy.disabled=true in homelab-cilium.yaml).
cluster:
  apiServer:
    image: registry.k8s.io/kube-apiserver:v1.36.2
  controllerManager:
    image: registry.k8s.io/kube-controller-manager:v1.36.2
  scheduler:
    image: registry.k8s.io/kube-scheduler:v1.36.2
  coreDNS:
    image: registry.k8s.io/coredns/coredns:v1.14.2
  etcd:
    image: registry.k8s.io/etcd:v3.6.12
