cluster:
    id: ENC[AES256_GCM,data:iYCPQVPEtDWQKG3lQ5WLZP2F3+24rb14bCw6tXLFvEzKIQ7LEnOzxYtLEts=,iv:7UQAXJPLM20K9TVJi+spmBEPpqEWEr0Lht7wSAYNkAE=,tag:8JpW9G274NhyTJU753qqZQ==,type:str] # Globally unique identifier for this cluster (base64 encoded random 32 bytes).
    secret: ENC[AES256_GCM,data:h6tci/N8aep1NgrFdmOWDv2StoYyDNrrtX3cBCab6N/n+mdQHopg0oy1Zjw=,iv:sWYKnBXA+maYbWGv+QHW7PQdHE1dcL75UgASO+Y4mi0=,tag:hQKH7FJR5O8AI8Pws2bO0w==,type:str] # Shared secret of cluster (base64 encoded random 32 bytes).
    # Provides control plane specific configuration options.
    controlPlane:
        endpoint: https://192.168.47.40:6443 # Endpoint transitions to VIP .240 once second CP node joins.
    clusterName: homelab # Configures the cluster's name.
    # Provides cluster specific network configuration options.
    network:
        dnsDomain: cluster.local # The domain used by Kubernetes DNS.
        # The pod subnet CIDR.
        podSubnets:
            - 10.244.0.0/16
        # The service subnet CIDR.
        serviceSubnets:
            - 10.96.0.0/12
            # # The CNI used.
            # cni:
            #     name: custom # Name of CNI to use.
            #     # URLs containing manifests to apply for the CNI.
            #     urls:
