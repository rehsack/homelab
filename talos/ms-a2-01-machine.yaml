machine:
  install:
    image: factory.talos.dev/metal-installer/999725387a6d9ec674b3a0985e84f063eeab6e3f3e8da22274f78b7fc6a19322:v1.13.4
    disk: /dev/sda
    wipe: true
  kubelet:
    image: ghcr.io/siderolabs/kubelet:v1.36.1
  network:
    interfaces:
      - interface: enp3s0
        dhcp: true
  nodeLabels:
    node.kubernetes.io/role: worker
    homelab.local/ceph-osd: "true"
    homelab.local/scratch-nvme: "true"
    homelab.local/llm-capable: "false"
  sysctls:
    vm.dirty_ratio: "10"
    vm.dirty_background_ratio: "5"
