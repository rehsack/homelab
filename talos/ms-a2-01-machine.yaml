machine:
  install:
    image: factory.talos.dev/metal-installer/76ba6863f04328e74266d078d7579d2e4423a6c5ac6dc105e9fff788048d3b0c:v1.14.4
    disk: /dev/sda
    wipe: true
  kubelet:
    image: ghcr.io/siderolabs/kubelet:v1.36.2
  network:
    interfaces:
      - interface: enp3s0
        dhcp: true
  nodeLabels:
    node.kubernetes.io/role: worker
    homelab.local/ceph-osd: "true"
    homelab.local/scratch-nvme: "true"
    homelab.local/llm-capable: "false"
  sysctls:
    vm.dirty_ratio: "10"
    vm.dirty_background_ratio: "5"
