# Ephemeral helper tools — run on the WORKSTATION (Docker/Colima), never in the
# cluster. Bring up only what you need, tear it down when done:
#
#   docker compose up <service> -d             # start one helper
#   docker compose down                        # stop everything
#
# Helpers reach cluster services over the LAN via their LoadBalancer IPs
# (192.168.47.200-209), not via kube-networking.
#
# QA fleet — where lefthook's tools come from. lefthook.yml names no container;
# lefthook-local.yml points its {gates}/{adoc}/{py-srv} templates at the services below
# (README, "QA fleet"). Warm runners: `sleep infinity` plus `docker compose exec` means
# one container start per session instead of one per job. Each mounts the repository
# root (`..`), so the paths lefthook hands over resolve inside the container.
#
# `gates` is the base fleet of lefthook-qa-gates; its image tag moves together with the
# contract copy lefthook/base.yml (`vX.Y.Z` ↔ `X.Y`, see lefthook.yml). AsciiDoc is a
# domain of its own, so it gets images of its own beside it rather than inside it.
#
# dclint dictates two shapes: services in alphabetical order, and nothing between
# `services:` and the first service key (a comment there does not survive `dclint --fix`).
#
# `adoc` — AsciiDoc validation, the same toolchain image the tpo42 documentation builds
# use (noted up here for the reason above).

name: homelab-helpers

services:
  adoc:
    image: ghcr.io/tpo42/adoc:1.0
    volumes:
      - ..:/workspace
    command:
      - sleep
      - infinity
    working_dir: /workspace
    user: "${USER_UID:-1000}:${USER_GID:-1000}"

  gates:
    image: ghcr.io/rehsack/lefthook-qa-gates:0.2
    volumes:
      - ..:/workspace
    # gitlint asks git for user.name, and the container never sees ~/.gitconfig. git's
    # env-based configuration answers it. Values come from helpers/.env (git-ignored, see
    # README); soft defaults, because compose interpolates the whole file even when only
    # another helper is started.
    environment:
      GIT_CONFIG_COUNT: "2"
      GIT_CONFIG_KEY_0: user.name
      GIT_CONFIG_VALUE_0: ${GIT_USER_NAME:-unset - see helpers/README.md}
      GIT_CONFIG_KEY_1: user.email
      GIT_CONFIG_VALUE_1: ${GIT_USER_EMAIL:-unset - see helpers/README.md}
    command:
      - sleep
      - infinity
    working_dir: /workspace
    # The fixers rewrite workspace files, so the container runs as the developer.
    user: "${USER_UID:-1000}:${USER_GID:-1000}"

  # Python gates fetched by uv on demand — asciidoc-linter (Ralf D. Müller,
  # docToolchain). Upstream publishes neither a PyPI package nor a tag, so lefthook.yml
  # pins it by commit. The home directory lives in a named volume, so caches and
  # downloaded tools stay out of the repository.
  python:
    image: ghcr.io/astral-sh/uv:0.12.21-python3.13-trixie
    depends_on:
      uv-home:
        condition: service_completed_successfully
    volumes:
      - ..:/workspace
      - uv-home:/home/uv
    environment:
      HOME: /home/uv
      UV_CACHE_DIR: /home/uv/.cache/uv
      UV_TOOL_DIR: /home/uv/.local/share/uv/tools
      UV_TOOL_BIN_DIR: /home/uv/.local/bin
    command:
      - sleep
      - infinity
    working_dir: /workspace
    user: "${USER_UID:-1000}:${USER_GID:-1000}"

  # The uv image brings no home directory, so a fresh named volume would be
  # root-owned and `python`, running as the developer, could not write. This one-shot
  # prepares it and exits.
  uv-home:
    image: ghcr.io/astral-sh/uv:0.12.21-python3.13-trixie
    volumes:
      - uv-home:/home/uv
    entrypoint:
      - sh
      - -c
      - chmod 0777 /home/uv
    user: "0:0"

volumes:
  uv-home:
