# Ephemeral helper tools — run on the WORKSTATION (Docker/Colima), never in the
# cluster. Bring up only what you need, tear it down when done:
#
#   docker compose up <service> -d             # start one helper
#   docker compose down                        # stop everything
#
# Helpers reach cluster services over the LAN via their LoadBalancer IPs
# (192.168.47.200-209), not via kube-networking.
name: homelab-helpers

services: {}
